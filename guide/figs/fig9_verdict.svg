<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 278" width="750" height="278" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#1f2328"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563b8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8551b"/></marker></defs><rect x="10" y="10" width="110" height="56" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="65" y="43.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">DNA</text><rect x="130" y="10" width="480" height="56" rx="8" fill="white" stroke="#eef0f3" stroke-width="1.5"/><text x="142" y="33.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">No extra ERBB2 copies, almost no breakpoints (9 of 155).</text><text x="142" y="48.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Controlling for copy number leaves the RNA link unchanged.</text><rect x="620" y="10" width="120" height="56" rx="8" fill="white" stroke="#6b7280" stroke-width="2"/><text x="680" y="43.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">not HER2</text><rect x="10" y="76" width="110" height="56" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="65" y="109.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">RNA</text><rect x="130" y="76" width="480" height="56" rx="8" fill="white" stroke="#eef0f3" stroke-width="1.5"/><text x="142" y="99.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">A real but modest link to ERBB2 RNA (0.30 to 0.48 in basal tumours),</text><text x="142" y="114.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">mostly carried by LAR and ER-low tumours (every LAR tumour sits in the top third).</text><rect x="620" y="76" width="120" height="56" rx="8" fill="#fbe3d4" stroke="#c8551b" stroke-width="2"/><text x="680" y="109.0" font-size="13" font-weight="700" text-anchor="middle" fill="#c8551b">mostly AR</text><rect x="10" y="142" width="110" height="56" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="65" y="175.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">Protein</text><rect x="130" y="142" width="480" height="56" rx="8" fill="white" stroke="#eef0f3" stroke-width="1.5"/><text x="142" y="165.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">HER2 0.21 and active HER2 0.18, both inside the random range.</text><text x="142" y="179.9" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">AR 0.50 and INPP4B 0.55, far outside it.</text><rect x="620" y="142" width="120" height="56" rx="8" fill="white" stroke="#6b7280" stroke-width="2"/><text x="680" y="175.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">not HER2</text><rect x="10" y="208" width="110" height="56" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="65" y="241.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">Normal tissue</text><rect x="130" y="208" width="480" height="56" rx="8" fill="white" stroke="#eef0f3" stroke-width="1.5"/><text x="142" y="231.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">Paired with their own normal tissue, TNBC do not raise ERBB2</text><text x="142" y="245.9" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">(6 of 13 go up); HER2+ tumours do (18 of 24).</text><rect x="620" y="208" width="120" height="56" rx="8" fill="white" stroke="#6b7280" stroke-width="2"/><text x="680" y="241.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">not HER2</text></svg>