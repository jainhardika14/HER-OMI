st in this tumour</text><line x1="200" y1="201" x2="560" y2="201" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><circle cx="66" cy="230" r="4.5" fill="#2563b8"/><text x="78" y="234.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">a gene the signature says should be UP (33 genes)</text><circle cx="446" cy="230" r="4.5" fill="none" stroke="#c8551b" stroke-width="1.8"/><text x="458" y="234.0" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2328">a gene that should be DOWN (67 genes)</text><text x="60" y="262.0" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">Score = how far right the up genes sit + how far left the down genes sit, each scaled to run from -0.5 to +0.5.</text><text x="60" y="280.0" font-size="12" font-weight="400" text-anchor="start" fill="#1f2328">Only the order inside one tumour matters, so RNA-seq (TCGA) and microarray (METABRIC) can be compared.</text></svg>