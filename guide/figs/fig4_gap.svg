<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 265" width="750" height="265" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#1f2328"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563b8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8551b"/></marker></defs><rect x="20" y="20" width="210" height="100" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="125" y="44.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">What IBCGA saw</text><text x="125" y="66.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">a group of TNBC whose RNA</text><text x="125" y="81.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">looks a bit like HER2+ cancer</text><text x="125" y="95.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">(144 genes)</text><line x1="232" y1="70" x2="268" y2="70" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="270" y="20" width="210" height="100" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="375" y="44.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">What they named it</text><text x="375" y="66.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">"HER2-like" or</text><text x="375" y="81.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">"transcriptionally</text><text x="375" y="95.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">HER2-active"</text><line x1="482" y1="70" x2="518" y2="70" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="520" y="20" width="210" height="100" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="625" y="44.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">What that implies</text><text x="625" y="66.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">these patients might</text><text x="625" y="81.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">respond to HER2</text><text x="625" y="95.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">drugs</text><line x1="125" y1="158" x2="125" y2="124" stroke="#c8551b" stroke-width="1.8" marker-end="url(#ao)" stroke-dasharray="4 3"/><rect x="20" y="160" width="210" height="92" rx="8" fill="white" stroke="#c8551b" stroke-width="1.5"/><text x="125" y="182.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c8551b">Q1  Is the HER2 part real?</text><text x="125" y="202.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">Remove the 9 genes that sit</text><text x="125" y="216.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">next to ERBB2. Does the</text><text x="125" y="231.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">score still track ERBB2?</text><line x1="375" y1="158" x2="375" y2="124" stroke="#c8551b" stroke-width="1.8" marker-end="url(#ao)" stroke-dasharray="4 3"/><rect x="270" y="160" width="210" height="92" rx="8" fill="white" stroke="#c8551b" stroke-width="1.5"/><text x="375" y="182.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c8551b">Q2  What else could it be?</text><text x="375" y="202.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">Does the score follow AR</text><text x="375" y="216.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">and the LAR subtype more</text><text x="375" y="231.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">than it follows HER2?</text><line x1="625" y1="158" x2="625" y2="124" stroke="#c8551b" stroke-width="1.8" marker-end="url(#ao)" stroke-dasharray="4 3"/><rect x="520" y="160" width="210" height="92" rx="8" fill="white" stroke="#c8551b" stroke-width="1.5"/><text x="625" y="182.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c8551b">Q3  Is there HER2 protein?</text><text x="625" y="202.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">Do high scorers carry more</text><text x="625" y="216.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">HER2 protein, or active</text><text x="625" y="231.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">HER2, than low scorers?</text></svg>