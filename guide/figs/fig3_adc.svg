<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 195" width="760" height="195" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#1f2328"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563b8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8551b"/></marker></defs><rect x="20" y="20" width="160" height="110" rx="8" fill="#dbe7f7" stroke="#2563b8" stroke-width="1.5"/><text x="100" y="44.0" font-size="14" font-weight="700" text-anchor="middle" fill="#2563b8">1  Bind</text><text x="100" y="68.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">the antibody arm</text><text x="100" y="83.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">locks onto HER2</text><text x="100" y="97.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">protein on the surface</text><line x1="182" y1="75" x2="203" y2="75" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="205" y="20" width="160" height="110" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="285" y="44.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">2  Swallow</text><text x="285" y="68.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">the cell pulls the</text><text x="285" y="83.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">receptor and drug</text><text x="285" y="97.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">inside</text><line x1="367" y1="75" x2="388" y2="75" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="390" y="20" width="160" height="110" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="470" y="44.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">3  Release</text><text x="470" y="68.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">the toxic payload is</text><text x="470" y="83.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">cut free inside</text><text x="470" y="97.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">the cell</text><line x1="552" y1="75" x2="573" y2="75" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="575" y="20" width="160" height="110" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="655" y="44.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">4  Kill</text><text x="655" y="68.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">the payload damages</text><text x="655" y="83.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">DNA; the cell dies</text><text x="655" y="97.9" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328">(and nearby cells)</text><text x="370" y="160.0" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2563b8">Step 1 needs HER2 protein on the cell surface. RNA alone cannot be grabbed.</text><text x="370" y="180.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">That is why the protein layer (step 8) is the deciding test for the drug claim.</text></svg>