<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="740" height="280" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#1f2328"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563b8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8551b"/></marker></defs><rect x="270" y="15" width="200" height="58" rx="8" fill="#fbe3d4" stroke="#c8551b" stroke-width="1.5"/><text x="370" y="38.0" font-size="14" font-weight="700" text-anchor="middle" fill="#c8551b">AR / LAR biology</text><text x="370" y="57.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">luminal, hormone-driven tumours</text><rect x="40" y="165" width="200" height="58" rx="8" fill="#fff" stroke="#1f2328" stroke-width="1.5"/><text x="140" y="190.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">HER2-like score</text><text x="140" y="208.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">(100 genes, no amplicon)</text><rect x="500" y="165" width="200" height="58" rx="8" fill="#dbe7f7" stroke="#2563b8" stroke-width="1.5"/><text x="600" y="190.0" font-size="14" font-weight="700" text-anchor="middle" fill="#2563b8">ERBB2 RNA</text><text x="600" y="208.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">(the HER2 gene)</text><line x1="320" y1="75" x2="175" y2="162" stroke="#c8551b" stroke-width="2.2" marker-end="url(#ao)"/><line x1="420" y1="75" x2="565" y2="162" stroke="#c8551b" stroke-width="2.2" marker-end="url(#ao)"/><line x1="244" y1="194" x2="496" y2="194" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/><text x="370" y="186.0" font-size="11.5" font-weight="600" text-anchor="middle" fill="#6b7280">the link we see</text><text x="370" y="214.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#1f2328" font-style="italic">is any of it left once AR is accounted for?</text><text x="370" y="250.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">If AR pushes both up, the score and ERBB2 will move together even with no HER2 biology.</text><text x="370" y="268.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">Fixes we used: take LAR and ER-low tumours out, or hold AR fixed with a partial correlation.</text></svg>