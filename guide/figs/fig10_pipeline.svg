" text-anchor="middle" fill="#1f2328">05 / 09 pathways   10 vs HER2+</text><rect x="450" y="108" width="220" height="66" rx="8" fill="white" stroke="#c8551b" stroke-width="1.5"/><text x="560.0" y="126.0" font-size="12" font-weight="700" text-anchor="middle" fill="#c8551b">What else explains it?</text><text x="560.0" y="142.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2328">06 confounders   07 TNBCtype</text><text x="560.0" y="155.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2328">12 ER-low sensitivity   15 clusters</text><rect x="450" y="186" width="220" height="66" rx="8" fill="white" stroke="#c8551b" stroke-width="1.5"/><text x="560.0" y="204.0" font-size="12" font-weight="700" text-anchor="middle" fill="#c8551b">Is HER2 protein there?</text><text x="560.0" y="220.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2328">08 RPPA and CPTAC</text><text x="560.0" y="233.7" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2328">08b robustness</text><rect x="450" y="264" width="220" height="66" rx="8" fill="white" stroke="#c8551b" stroke-width="1.5"/><text x="560.0" y="282.0" font-size="12" font-weight="700" text-anchor="middle" fill="#c8551b">DNA and normal tissue?</text><text x="560.0" y="298.0" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2328">11 DNA layer   13 normal vs</text><text x="560.0" y="311.6" font-size="10.5" font-weight="400" text-anchor="middle" fill="#1f2328">tumour   14 admixture</text><line x1="382" y1="270" x2="420" y2="270" stroke="#6b7280" stroke-width="1.8"/><line x1="420" y1="63" x2="420" y2="297" stroke="#6b7280" stroke-width="1.8"/><line x1="420" y1="63" x2="448" y2="63" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><line x1="420" y1="141" x2="448" y2="141" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><line x1="420" y1="219" x2="448" y2="219" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><line x1="420" y1="297"