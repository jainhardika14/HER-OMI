<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#1f2328"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563b8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8551b"/></marker></defs><rect x="20" y="20" width="190" height="190" rx="8" fill="#dbe7f7" stroke="#2563b8" stroke-width="1.5"/><text x="115.0" y="46.0" font-size="18" font-weight="700" text-anchor="middle" fill="#2563b8">DNA</text><text x="115.0" y="66.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328" font-style="italic">the recipe book</text><text x="115.0" y="96.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">The ERBB2 gene sits on</text><text x="115.0" y="111.6" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">chromosome 17. Extra copies</text><text x="115.0" y="127.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">(amplification) make HER2+</text><text x="115.0" y="142.8" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">cancer.</text><rect x="20" y="225" width="190" height="70" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="115.0" y="244.0" font-size="11" font-weight="600" text-anchor="middle" fill="#6b7280">what we checked here</text><text x="115.0" y="261.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">copy number and</text><text x="115.0" y="275.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">breakpoints near ERBB2</text><text x="115.0" y="289.6" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">(step 11)</text><line x1="214" y1="115" x2="246" y2="115" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="250" y="20" width="190" height="190" rx="8" fill="#e8f0fb" stroke="#2563b8" stroke-width="1.5"/><text x="345.0" y="46.0" font-size="18" font-weight="700" text-anchor="middle" fill="#2563b8">RNA</text><text x="345.0" y="66.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328" font-style="italic">a working copy of one recipe</text><text x="345.0" y="96.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">The cell copies ERBB2 into</text><text x="345.0" y="111.6" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">messenger RNA. RNA levels</text><text x="345.0" y="127.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">of thousands of genes can</text><text x="345.0" y="142.8" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">be read at once.</text><rect x="250" y="225" width="190" height="70" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="345.0" y="244.0" font-size="11" font-weight="600" text-anchor="middle" fill="#6b7280">what we checked here</text><text x="345.0" y="261.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">the 144 gene score and</text><text x="345.0" y="275.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">ERBB2 mRNA</text><text x="345.0" y="289.6" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">(steps 2 to 7, 13 to 15)</text><line x1="444" y1="115" x2="476" y2="115" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="480" y="20" width="190" height="190" rx="8" fill="#dbe7f7" stroke="#2563b8" stroke-width="1.5"/><text x="575.0" y="46.0" font-size="18" font-weight="700" text-anchor="middle" fill="#2563b8">Protein</text><text x="575.0" y="66.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328" font-style="italic">the dish that is served</text><text x="575.0" y="96.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">Ribosomes read the RNA and</text><text x="575.0" y="111.6" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">build the HER2 receptor,</text><text x="575.0" y="127.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">which sits on the cell</text><text x="575.0" y="142.8" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">surface.</text><rect x="480" y="225" width="190" height="70" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/><text x="575.0" y="244.0" font-size="11" font-weight="600" text-anchor="middle" fill="#6b7280">what we checked here</text><text x="575.0" y="261.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">HER2 and active HER2</text><text x="575.0" y="275.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">(pY1248) protein</text><text x="575.0" y="289.6" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">(step 8)</text><line x1="674" y1="115" x2="706" y2="115" stroke="#6b7280" stroke-width="1.8" marker-end="url(#a)"/><rect x="710" y="20" width="150" height="190" rx="8" fill="#fbe3d4" stroke="#c8551b" stroke-width="1.5"/><text x="785" y="46.0" font-size="18" font-weight="700" text-anchor="middle" fill="#c8551b">The drug</text><text x="785" y="66.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328" font-style="italic">trastuzumab deruxtecan</text><text x="785" y="96.0" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">An antibody that</text><text x="785" y="111.6" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">grabs HER2 protein</text><text x="785" y="127.2" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">on the surface.</text><text x="785" y="142.8" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">No protein, nothing</text><text x="785" y="158.4" font-size="12" font-weight="400" text-anchor="middle" fill="#1f2328">to grab.</text><text x="785" y="250.0" font-size="11" font-weight="600" text-anchor="middle" fill="#c8551b">The claim we test:</text><text x="785" y="264.3" font-size="11" font-weight="600" text-anchor="middle" fill="#c8551b">HER2-like RNA means</text><text x="785" y="278.6" font-size="11" font-weight="600" text-anchor="middle" fill="#c8551b">this drug could work.</text></svg>