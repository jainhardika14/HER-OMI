<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" font-family="Inter, DejaVu Sans, sans-serif" font-size="13" fill="#1f2328"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563b8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8551b"/></marker></defs><rect x="210" y="10" width="340" height="46" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="380" y="31.0" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">Breast cancer</text><text x="380" y="48.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">pathologist stains for three proteins: ER, PR, HER2</text><path d="M380,56 L380,72 L135,72 L135,88" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="30" y="88" width="210" height="80" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="135" y="108.0" font-size="13" font-weight="700" text-anchor="middle" fill="#6b7280">Hormone receptor positive</text><text x="135" y="126.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">ER or PR present</text><text x="135" y="140.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">about 70% of patients</text><text x="135" y="154.6" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">hormone pills work</text><path d="M380,56 L380,72 L380,72 L380,88" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="275" y="88" width="210" height="80" rx="8" fill="#dbe7f7" stroke="#2563b8" stroke-width="1.5"/><text x="380" y="108.0" font-size="13" font-weight="700" text-anchor="middle" fill="#2563b8">HER2 positive</text><text x="380" y="126.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">HER2 protein in excess</text><text x="380" y="140.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">about 15%</text><text x="380" y="154.6" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">anti-HER2 drugs work</text><path d="M380,56 L380,72 L625,72 L625,88" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="520" y="88" width="210" height="80" rx="8" fill="#fff" stroke="#1f2328" stroke-width="2"/><text x="625" y="108.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">Triple negative (TNBC)</text><text x="625" y="126.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">none of the three</text><text x="625" y="140.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">about 15%</text><text x="625" y="154.6" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">no targeted drug, chemo</text><path d="M625,168 L625,186 L425,186 L425,200" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="330" y="200" width="190" height="82" rx="8" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="425" y="219.0" font-size="12" font-weight="700" text-anchor="middle" fill="#6b7280">Basal-like</text><text x="425" y="238.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">most TNBC; looks like</text><text x="425" y="252.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">the outer (basal) duct cells</text><path d="M625,168 L625,186 L625,186 L625,200" fill="none" stroke="#6b7280" stroke-width="1.5"/><rect x="530" y="200" width="190" height="82" rx="8" fill="#fbe3d4" stroke="#c8551b" stroke-width="1.5"/><text x="625" y="219.0" font-size="12" font-weight="700" text-anchor="middle" fill="#c8551b">LAR (luminal androgen</text><text x="625" y="234.6" font-size="12" font-weight="700" text-anchor="middle" fill="#c8551b">receptor)</text><text x="625" y="250.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">driven by the AR hormone</text><text x="625" y="264.3" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">receptor; looks luminal</text><rect x="250" y="300" width="470" height="56" rx="8" fill="white" stroke="#2563b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="485" y="322.0" font-size="12" font-weight="700" text-anchor="middle" fill="#2563b8">IBCGA (Indian cohort) proposed a new TNBC group: "HER2-like"</text><text x="485" y="340.0" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2328">Our question: is it really HER2, or is it the orange LAR box under another name?</text></svg>